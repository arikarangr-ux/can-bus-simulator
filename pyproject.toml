[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-bus-simulator"
version = "0.1.0"
description = "DBC-driven EV powertrain CAN simulator with E2E checks"
requires-python = ">=3.10"
dependencies = ["python-can>=4.3", "cantools>=39.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["can_sim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
